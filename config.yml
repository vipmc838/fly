# 盘古监控 Agent - Panggu 插件版配置
# ============================================

# 哪吒面板连接地址，格式: host:port (不含 http/https)
server: nezha.loc.cc:443

# 面板中该 Agent 的 ClientSecret（密钥）
client_secret: '4z0HWnSGJtKFtKOlfJxSkNC3F8PIJ448'

# Agent UUID，首次启动自动生成，请勿手动修改
uuid: a6b091a6-679b-47d1-bc72-a4ac78ba2775

# 是否启用 TLS 加密连接（面板开启了 HTTPS/TLS 时设为 true）
tls: true

# 是否跳过 TLS 证书验证（自签名证书时设为 true）
insecure_tls: false

# 上报间隔（秒），合法值 1-4，默认 3
report_delay: 3

# 是否跳过 TCP/UDP 连接数统计（减少开销）
skip_connection_count: false

# 是否跳过进程数统计
skip_procs_count: false

# 是否禁止面板下发命令执行
disable_command_execute: false

# 是否禁止 NAT 内网穿透
disable_nat: true

# 调试日志
debug: false
